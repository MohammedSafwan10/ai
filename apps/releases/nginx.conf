server {
    listen 8080;
    server_name _;
    root /srv/privora;
    server_tokens off;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    add_header Access-Control-Allow-Origin "https://privora.nexdark.com" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Disposition, ETag" always;
    location = /health { access_log off; default_type text/plain; return 200 'ok'; }
    location = /win32/x64/stable { default_type application/json; add_header Cache-Control "no-store"; add_header Access-Control-Allow-Origin "https://privora.nexdark.com" always; alias /srv/privora/current/metadata.json; }
    location = /win32/x64/stable/ { default_type application/json; add_header Cache-Control "no-store"; add_header Access-Control-Allow-Origin "https://privora.nexdark.com" always; alias /srv/privora/current/metadata.json; }
    location = /win32/x64/stable/RELEASES { default_type text/plain; add_header Cache-Control "no-store"; alias /srv/privora/current/RELEASES; }
    location = /win32/x64/stable/PrivoraSetup.exe { default_type application/octet-stream; add_header Cache-Control "no-store"; add_header Content-Disposition 'attachment; filename="PrivoraSetup.exe"'; alias /srv/privora/current/PrivoraSetup.exe; }
    location ~ ^/win32/x64/stable/(Privora-[0-9]+\.[0-9]+\.[0-9]+-full\.nupkg)$ { default_type application/octet-stream; add_header Cache-Control "public, max-age=31536000, immutable"; alias /srv/privora/packages/$1; }
    location ~ ^/win32/x64/stable/(PrivoraSetup-[0-9]+\.[0-9]+\.[0-9]+\.exe)$ { default_type application/octet-stream; add_header Cache-Control "public, max-age=31536000, immutable"; alias /srv/privora/installers/$1; }
    location / { return 404; }
}
